<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aceitar convite</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Geist',system-ui,sans-serif}</style>
</helmet>
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #fafafa; padding: 32px">
<div class="col" style="width: min(460px, 100%); gap: 20px">
<div class="row" style="justify-content: center; gap: 10px"><div style="width: 36px; height: 36px; border-radius: 9px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div><b style="font-size: 17px">Farmácia Exemplo</b></div>
<div class="card"><div class="card-b col" style="gap: 18px; padding: 28px">
<div><h1 class="h1" style="font-size: 22px">Você foi convidado</h1><p class="muted">Maria Souza convidou você para entrar na equipe.</p></div>
<div class="alert alert-soft" style="justify-content: space-between; align-items: center"><span>Sua função</span><span class="badge b-default">{{role}}</span></div>
<div class="sm muted">{{roleDesc}}</div>
<div class="field"><label class="label" for="n">Nome</label><input id="n" class="input" value="Bruno Dias"></div>
<div class="field"><label class="label" for="e">E-mail</label><input id="e" class="input" value="bruno@farmaciaexemplo.com.br" disabled></div>
<div class="field"><label class="label" for="p">Crie uma senha</label><input id="p" type="password" class="input" value="senhasenha"></div>
<label class="row" style="gap: 10px; align-items: flex-start"><button class="{{chkCls}}" role="checkbox" aria-checked="{{checked}}" aria-label="Aceito" onClick="{{ toggle }}" style="cursor: pointer">{{mark}}</button><span class="sm">Entendo que dados de saúde dos clientes são sensíveis e vou usá-los só para atender pedidos (LGPD).</span></label>
<a class="btn btn-lg" href="Home.dc.html">Criar conta e entrar</a>
</div></div>
<div class="row" style="justify-content: center"><span class="xs muted">Prévia da função:</span><div class="tabs"><sc-for list="{{roles}}" as="r" hint-placeholder-count="3"><button class="{{r.cls}}" onClick="{{ r.pick }}">{{r.label}}</button></sc-for></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { r: 0, checked: true };
  renderVals() {
    const S = this.state;
    const defs = [['Atendente', 'Acompanha pedidos, consulta catálogo e clientes.'], ['Farmacêutico RT', 'Valida receitas e responde atendimentos. Pede seu CRF no primeiro acesso.'], ['Entregador', 'Vê somente as próprias entregas.']];
    return { role: defs[S.r][0], roleDesc: defs[S.r][1], roles: defs.map(([label], i) => ({ label, cls: S.r === i ? 'tab on' : 'tab', pick: () => this.setState({ r: i }) })), checked: S.checked, chkCls: S.checked ? 'chk on' : 'chk', mark: S.checked ? '✓' : '', toggle: () => this.setState({ checked: !S.checked }) };
  }
}
</script>
</body>
</html>
