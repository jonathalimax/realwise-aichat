<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Plano e cobrança</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Geist',system-ui,sans-serif}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #fafafa">
<div style="flex: 1 1 260px; max-width: 260px"><dc-import name="Sidebar" active="Plano e cobrança" hint-size="260px,100vh"></dc-import></div>
<main style="flex: 999 1 640px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px; max-width: 1040px">
<div><h1 class="h1">Plano e cobrança</h1><p class="muted">Seu plano, uso do mês e faturas</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div class="card" style="flex: 1 1 340px"><div class="card-h"><div><h2 class="h2">Plano atual</h2><p class="xs muted">Renova em 28 de outubro</p></div><span class="badge b-default">Profissional</span></div>
<div class="card-b col" style="gap: 14px"><div><span style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em">R$ 297</span><span class="muted"> /mês</span></div><div class="col sm" style="gap: 6px"><span>✓ Pedidos ilimitados pelo chat</span><span>✓ Até 10 usuários na equipe</span><span>✓ Importação de planilha com IA</span></div><div class="row"><button class="btn">Mudar de plano</button><button class="btn btn-outline">Atualizar pagamento</button></div></div></div>
<div class="card" style="flex: 1 1 340px"><div class="card-h"><div><h2 class="h2">Uso do mês</h2></div></div>
<div class="card-b col" style="gap: 18px"><sc-for list="{{usage}}" as="u" hint-placeholder-count="3"><div class="col" style="gap: 6px"><div class="row sm" style="justify-content: space-between"><span>{{u.l}}</span><b>{{u.v}}</b></div><div class="bar"><i style="width: {{u.w}}%"></i></div></div></sc-for></div></div>
</div>
<div class="card"><div class="card-h"><div><h2 class="h2">Faturas</h2></div></div><div class="card-b scroll-x" style="padding-top: 8px"><table class="tbl"><thead><tr><th>Fatura</th><th>Data</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>
<sc-for list="{{invoices}}" as="i" hint-placeholder-count="3"><tr><td><b>{{i.n}}</b></td><td class="muted">{{i.d}}</td><td>{{i.v}}</td><td><span class="badge b-green">Paga</span></td><td style="text-align: right"><button class="btn btn-ghost btn-sm">Baixar PDF</button></td></tr></sc-for></tbody></table></div></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      usage: [{ l: 'Conversas com o Alex', v: '1.240 de 3.000', w: 41 }, { l: 'Usuários da equipe', v: '5 de 10', w: 50 }, { l: 'Importações de planilha', v: '3 de 20', w: 15 }],
      invoices: [{ n: 'FAT-2026-10', d: '28 set 2026', v: 'R$ 297,00' }, { n: 'FAT-2026-09', d: '28 ago 2026', v: 'R$ 297,00' }, { n: 'FAT-2026-08', d: '28 jul 2026', v: 'R$ 297,00' }]
    };
  }
}
</script>
</body>
</html>
