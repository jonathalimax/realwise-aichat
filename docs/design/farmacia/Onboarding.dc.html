<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assistente</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Geist',system-ui,sans-serif}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #fafafa">
<div style="flex: 1 1 260px; max-width: 260px"><dc-import name="Sidebar" active="Assistente" hint-size="260px,100vh"></dc-import></div>
<main style="flex: 999 1 640px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div><h1 class="h1">Assistente</h1><p class="muted">Conte sobre a farmácia. Eu preencho as configurações e você confirma.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div class="card" style="flex: 2 1 480px; min-width: 0">
<div class="card-b col" style="gap: 14px; min-height: 520px">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
<div style="display: flex; justify-content: {{m.just}}"><div style="max-width: 80%; padding: 10px 14px; border-radius: 12px; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.bd}}">{{m.t}}</div></div>
</sc-for>
<sc-if value="{{finished}}" hint-placeholder-val="{{ false }}"><div class="alert alert-soft" style="justify-content: space-between; align-items: center; flex-wrap: wrap"><span>Pronto! Preenchi as configurações. Falta você confirmar.</span><a class="btn btn-sm" href="Settings.dc.html">Revisar em Farmácia</a></div></sc-if>
<div style="margin-top: auto" class="col">
<sc-if value="{{hasReplies}}" hint-placeholder-val="{{ true }}"><div class="row wrap"><sc-for list="{{replies}}" as="r" hint-placeholder-count="3"><button class="btn btn-outline btn-sm" onClick="{{ r.pick }}">{{r.label}}</button></sc-for></div></sc-if>
<div class="row"><input class="input" placeholder="Escreva sua resposta" aria-label="Mensagem"><button class="btn">Enviar</button></div>
</div>
</div></div>
<div class="card" style="flex: 1 1 300px; min-width: 0"><div class="card-h"><div><h2 class="h2">Perfil da farmácia</h2><p class="xs muted">{{done}} de {{total}} campos</p></div></div>
<div class="card-b col" style="gap: 10px"><div class="bar"><i style="width: {{pct}}%"></i></div>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6"><div class="row" style="justify-content: space-between"><span class="sm">{{f.label}}</span><span class="badge {{f.badge}}">{{f.state}}</span></div></sc-for>
</div></div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  state = { step: 0 };
  renderVals() {
    const S = this.state;
    const qa = [
      { q: 'Oi, Maria! Eu sou o Assistente. Vamos começar: qual é a razão social e o CNPJ da farmácia?', a: ['Farmácia Exemplo Ltda., 12.345.678/0001-90'], f: 'Razão social e CNPJ' },
      { q: 'Quem é o farmacêutico responsável e qual o CRF?', a: ['Maria Souza, CRF-PR 1234'], f: 'Farmacêutico responsável' },
      { q: 'Quais bairros vocês atendem e qual a taxa de entrega?', a: ['Água Verde, Batel, Centro e Cabral por R$ 6,00'], f: 'Área e taxa de entrega' },
      { q: 'Vocês têm retirada em loja? E pedido mínimo?', a: ['Sim, retirada ligada. Mínimo R$ 15,00'], f: 'Retirada e pedido mínimo' },
      { q: 'Algum produto de venda livre que sempre precisa do farmacêutico?', a: ['Descongestionante nasal e xarope para tosse'], f: 'Produtos que exigem farmacêutico' },
      { q: 'Quais horários de funcionamento?', a: ['Seg a sex 8h às 20h, sábado 8h às 18h'], f: 'Horários' }
    ];
    const msgs = [];
    qa.forEach((x, i) => {
      if (i <= S.step) msgs.push({ t: x.q, just: 'flex-start', bg: '#fff', fg: '#09090b', bd: '#e4e4e7' });
      if (i < S.step) msgs.push({ t: x.a[0], just: 'flex-end', bg: '#0F766E', fg: '#fff', bd: '#0F766E' });
    });
    const finished = S.step >= qa.length;
    const cur = qa[S.step];
    const fields = qa.map((x, i) => ({ label: x.f, state: i < S.step ? 'confirmar' : 'pendente', badge: i < S.step ? 'b-amber' : 'b-gray' }));
    const msgsOut = finished ? msgs : msgs;
    return {
      msgs: msgsOut, finished, hasReplies: !finished,
      replies: cur ? cur.a.map((label) => ({ label, pick: () => this.setState({ step: S.step + 1 }) })) : [],
      fields, done: Math.min(S.step, qa.length), total: qa.length, pct: Math.round((Math.min(S.step, qa.length) / qa.length) * 100)
    };
  }
}
</script>
</body>
</html>
