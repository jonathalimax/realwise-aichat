name: realwise-aichat

services:
  api:
    image: ghcr.io/jonathalimax/realwise-api:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - realwise_storage:/data/realwise-storage
    networks:
      - default
      - shared-infra
    # node:20-slim has no curl/wget (confirmed) -- Node's own http module is always present, so
    # this checks for any non-5xx response (any valid HTTP response, including a 404 on a path
    # with no handler, proves the server is actually listening and answering).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-api.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/api`)
      - traefik.http.routers.realwise-api.entrypoints=https
      - traefik.http.routers.realwise-api.tls=true
      - traefik.http.routers.realwise-api.tls.certresolver=letsencrypt
      - traefik.http.routers.realwise-api.priority=300
      - traefik.http.services.realwise-api.loadbalancer.server.port=3006
      # A Traefik-level loadbalancer.healthcheck was tried here and reverted -- it caused the
      # api backend to flap between 503/timeout even though /api/health verifiably returned 200
      # on direct container access throughout. Root cause not yet isolated (suspected Host-header
      # or NestJS middleware interaction with Traefik's prober specifically); don't re-add this
      # without reproducing and fixing that interaction first. Docker's own HEALTHCHECK above is
      # still in effect and covers Coolify/deploy-ordering readiness.

  worker:
    image: ghcr.io/jonathalimax/realwise-worker:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - realwise_storage:/data/realwise-storage
    networks:
      - default
      - shared-infra
    depends_on:
      - ollama-embeddings
    # No HTTP server here (BullMQ worker process only, no listening port) -- a real healthcheck
    # would need to verify the worker is actually consuming the queue, not just that the
    # container hasn't exited (restart: unless-stopped already covers a hard crash). Skipped
    # rather than adding a "node -e process.exit(0)"-style check that would always report
    # healthy regardless of whether the worker is actually processing jobs.

  # Chat generation moved to the managed provider in production, but embedText() (apps/worker/
  # src/embeddings.ts) always calls Ollama directly with no managed-provider fallback — there was
  # no embeddings service in production at all until now, so every single document/website-sync
  # ingestion job failed with "fetch failed" (ECONNREFUSED to the OLLAMA_URL default/localhost).
  # nomic-embed-text is small (~275MB) — this is viable even on a small VPS.
  ollama-embeddings:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 5 && ollama pull nomic-embed-text; wait"]

  inference-gateway:
    image: ghcr.io/jonathalimax/realwise-inference-gateway:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - default
      - shared-infra
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  chat:
    image: ghcr.io/jonathalimax/realwise-chat:latest
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      # Priorities are EXPLICIT so routers can never shadow each other (Traefik otherwise ranks by rule length):
      # api/admin/dashboards 300 > chat 200 > marketing 1. That is why /api/chat/... reaches the API even though
      # `/api/chat` also matches the chat regex below.
      # Chat pages: /<client-slug>/chat, /<client-slug>/pedido/<token> and the legacy /client/conversation/<slug>
      # (kept as a redirect by the chat app). NOTE: in docker compose "$" must be written "$$".
      - traefik.http.routers.realwise-chat.rule=Host(`aichat.realwise.com.br`) && (PathRegexp(`^/[^/]+/(chat|pedido)(/.*)?$$`) || PathPrefix(`/client/conversation`))
      - traefik.http.routers.realwise-chat.entrypoints=https
      - traefik.http.routers.realwise-chat.tls=true
      - traefik.http.routers.realwise-chat.tls.certresolver=letsencrypt
      - traefik.http.routers.realwise-chat.priority=200
      # Chat static assets live under /_c (assetPrefix); the prefix is stripped before reaching the chat container.
      # ONLY /_c is stripped, the page router above forwards the path untouched.
      - traefik.http.middlewares.realwise-chat-strip-c.stripprefix.prefixes=/_c
      - traefik.http.routers.realwise-chat-assets.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/_c`)
      - traefik.http.routers.realwise-chat-assets.entrypoints=https
      - traefik.http.routers.realwise-chat-assets.tls=true
      - traefik.http.routers.realwise-chat-assets.tls.certresolver=letsencrypt
      - traefik.http.routers.realwise-chat-assets.middlewares=realwise-chat-strip-c
      - traefik.http.routers.realwise-chat-assets.priority=200
      - traefik.http.services.realwise-chat.loadbalancer.server.port=3000

  # Dashboard = same code built three times (one image per niche, basePath baked in at build time, see deploy.yml).
  # Real estate keeps the original service/image name; farmacia and concessionaria are new services below.
  dashboard:
    image: ghcr.io/jonathalimax/realwise-dashboard:latest
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-dashboard.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/imobiliaria/app`)
      - traefik.http.routers.realwise-dashboard.entrypoints=https
      - traefik.http.routers.realwise-dashboard.tls=true
      - traefik.http.routers.realwise-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.realwise-dashboard.priority=300
      - traefik.http.services.realwise-dashboard.loadbalancer.server.port=3000

  dashboard-farmacia:
    image: ghcr.io/jonathalimax/realwise-dashboard-farmacia:latest
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-dashboard-farmacia.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/farmacia/app`)
      - traefik.http.routers.realwise-dashboard-farmacia.entrypoints=https
      - traefik.http.routers.realwise-dashboard-farmacia.tls=true
      - traefik.http.routers.realwise-dashboard-farmacia.tls.certresolver=letsencrypt
      - traefik.http.routers.realwise-dashboard-farmacia.priority=300
      - traefik.http.services.realwise-dashboard-farmacia.loadbalancer.server.port=3000

  dashboard-concessionaria:
    image: ghcr.io/jonathalimax/realwise-dashboard-concessionaria:latest
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-dashboard-concessionaria.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/concessionaria/app`)
      - traefik.http.routers.realwise-dashboard-concessionaria.entrypoints=https
      - traefik.http.routers.realwise-dashboard-concessionaria.tls=true
      - traefik.http.routers.realwise-dashboard-concessionaria.tls.certresolver=letsencrypt
      - traefik.http.routers.realwise-dashboard-concessionaria.priority=300
      - traefik.http.services.realwise-dashboard-concessionaria.loadbalancer.server.port=3000

  admin:
    image: ghcr.io/jonathalimax/realwise-admin:latest
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-admin.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/admin`)
      - traefik.http.routers.realwise-admin.entrypoints=https
      - traefik.http.routers.realwise-admin.tls=true
      - traefik.http.routers.realwise-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.realwise-admin.priority=300
      - traefik.http.services.realwise-admin.loadbalancer.server.port=3000

  marketing:
    image: ghcr.io/jonathalimax/realwise-marketing:latest
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.realwise-redirect-https.redirectscheme.scheme=https
      - traefik.http.routers.realwise-marketing.rule=Host(`aichat.realwise.com.br`)
      - traefik.http.routers.realwise-marketing.entrypoints=https
      - traefik.http.routers.realwise-marketing.tls=true
      - traefik.http.routers.realwise-marketing.tls.certresolver=letsencrypt
      - traefik.http.services.realwise-marketing.loadbalancer.server.port=3000
      - traefik.http.services.realwise-marketing.loadbalancer.healthcheck.path=/
      - traefik.http.services.realwise-marketing.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.realwise-marketing.loadbalancer.healthcheck.timeout=5s
      - traefik.http.routers.realwise-marketing.priority=1
      - traefik.http.routers.realwise-marketing-http.rule=Host(`aichat.realwise.com.br`)
      - traefik.http.routers.realwise-marketing-http.entrypoints=http
      - traefik.http.routers.realwise-marketing-http.middlewares=realwise-redirect-https
      - traefik.http.routers.realwise-marketing-http.priority=1

volumes:
  realwise_storage:
  ollama_data:

networks:
  # Coolify manages the compose project's own "default" network itself (for Traefik + inter-
  # service routing) and overrides any attempt to rename/replace it, so Postgres/Redis are
  # reached via this separate, dedicated network instead — NOT the global "coolify" network
  # every other tenant on this VPS shares, which would let any co-located container reach
  # api/worker/inference-gateway directly, bypassing Traefik entirely. Postgres/Redis were
  # explicitly attached to this network (docker network connect) alongside their own existing
  # one, so nothing about their original connectivity changed.
  shared-infra:
    name: realwise-data
    external: true
