name: realwise-aichat

services:
  api:
    image: ghcr.io/jonathalimax/realwise-api:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - realwise_storage:/data/realwise-storage
    networks:
      - default
      - shared-infra
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-api.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/api`)
      - traefik.http.routers.realwise-api.entrypoints=https
      - traefik.http.routers.realwise-api.tls=true
      - traefik.http.routers.realwise-api.tls.certresolver=letsencrypt
      - traefik.http.services.realwise-api.loadbalancer.server.port=3006

  worker:
    image: ghcr.io/jonathalimax/realwise-worker:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - realwise_storage:/data/realwise-storage
    networks:
      - default
      - shared-infra
    depends_on:
      - ollama-embeddings

  # Chat generation moved to the managed provider in production, but embedText() (apps/worker/
  # src/embeddings.ts) always calls Ollama directly with no managed-provider fallback — there was
  # no embeddings service in production at all until now, so every single document/website-sync
  # ingestion job failed with "fetch failed" (ECONNREFUSED to the OLLAMA_URL default/localhost).
  # nomic-embed-text is small (~275MB) — this is viable even on a small VPS.
  ollama-embeddings:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 5 && ollama pull nomic-embed-text; wait"]

  inference-gateway:
    image: ghcr.io/jonathalimax/realwise-inference-gateway:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - default
      - shared-infra

  chat:
    image: ghcr.io/jonathalimax/realwise-chat:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-chat.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/client/conversation`)
      - traefik.http.routers.realwise-chat.entrypoints=https
      - traefik.http.routers.realwise-chat.tls=true
      - traefik.http.routers.realwise-chat.tls.certresolver=letsencrypt
      - traefik.http.services.realwise-chat.loadbalancer.server.port=3000

  dashboard:
    image: ghcr.io/jonathalimax/realwise-dashboard:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-dashboard.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/app`)
      - traefik.http.routers.realwise-dashboard.entrypoints=https
      - traefik.http.routers.realwise-dashboard.tls=true
      - traefik.http.routers.realwise-dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.realwise-dashboard.loadbalancer.server.port=3000

  admin:
    image: ghcr.io/jonathalimax/realwise-admin:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.realwise-admin.rule=Host(`aichat.realwise.com.br`) && PathPrefix(`/admin`)
      - traefik.http.routers.realwise-admin.entrypoints=https
      - traefik.http.routers.realwise-admin.tls=true
      - traefik.http.routers.realwise-admin.tls.certresolver=letsencrypt
      - traefik.http.services.realwise-admin.loadbalancer.server.port=3000

  marketing:
    image: ghcr.io/jonathalimax/realwise-marketing:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.realwise-redirect-https.redirectscheme.scheme=https
      - traefik.http.routers.realwise-marketing.rule=Host(`aichat.realwise.com.br`)
      - traefik.http.routers.realwise-marketing.entrypoints=https
      - traefik.http.routers.realwise-marketing.tls=true
      - traefik.http.routers.realwise-marketing.tls.certresolver=letsencrypt
      - traefik.http.services.realwise-marketing.loadbalancer.server.port=3000
      - traefik.http.routers.realwise-marketing.priority=1
      - traefik.http.routers.realwise-marketing-http.rule=Host(`aichat.realwise.com.br`)
      - traefik.http.routers.realwise-marketing-http.entrypoints=http
      - traefik.http.routers.realwise-marketing-http.middlewares=realwise-redirect-https
      - traefik.http.routers.realwise-marketing-http.priority=1

volumes:
  realwise_storage:
  ollama_data:

networks:
  # Coolify manages the compose project's own "default" network itself (for Traefik + inter-
  # service routing) and overrides any attempt to rename/replace it, so Postgres/Redis are
  # reached via this separate, dedicated network instead — NOT the global "coolify" network
  # every other tenant on this VPS shares, which would let any co-located container reach
  # api/worker/inference-gateway directly, bypassing Traefik entirely. Postgres/Redis were
  # explicitly attached to this network (docker network connect) alongside their own existing
  # one, so nothing about their original connectivity changed.
  shared-infra:
    name: realwise-data
    external: true
