services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: realwise
      POSTGRES_PASSWORD: realwise
      POSTGRES_DB: realwise
    ports:
      - "5432:5432"
    volumes:
      - realwise_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  realwise_pg_data:
