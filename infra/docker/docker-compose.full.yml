services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: realwise
      POSTGRES_PASSWORD: realwise
      POSTGRES_DB: realwise
    volumes:
      - realwise_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../.env
    ports:
      - "3001:3001"
    depends_on: [postgres, redis]

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file: ../../.env
    depends_on: [postgres, redis]

  inference-gateway:
    build:
      context: ../..
      dockerfile: apps/inference-gateway/Dockerfile
    env_file: ../../.env
    ports:
      - "3002:3002"
    depends_on: [postgres]

  chat:
    build:
      context: ../..
      dockerfile: apps/chat/Dockerfile
    env_file: ../../.env
    ports:
      - "3000:3000"
    depends_on: [api]

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    env_file: ../../.env
    ports:
      - "3003:3003"
    depends_on: [api]

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    env_file: ../../.env
    ports:
      - "3004:3004"
    depends_on: [api]

volumes:
  realwise_pg_data:
