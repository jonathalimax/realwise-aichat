name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, inference-gateway, chat, dashboard, admin, marketing]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN was denied package-write (permission_denied: write_package) despite the
          # workflow's own packages:write permission — using a PAT with confirmed write:packages
          # scope instead.
          # MANUAL FOLLOW-UP (not yet done): GHCR_PAT is currently a broad classic PAT. Rotate it
          # for a fine-grained PAT scoped to exactly: this repo only (jonathalimax/realwise-aichat),
          # permission "Contents: Read" + "Packages: Read and write" — nothing else. Classic PATs
          # can't be scoped to a single repo at all, which is the actual problem being fixed here.
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/realwise-${{ matrix.app }}:latest,ghcr.io/${{ env.IMAGE_OWNER }}/realwise-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://aichat.realwise.com.br/api
            NEXT_PUBLIC_CHAT_URL=https://aichat.realwise.com.br/client/conversation
            NEXT_PUBLIC_DASHBOARD_URL=https://aichat.realwise.com.br/imobiliaria/app
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy prisma schema + migrations to VPS
        run: |
          tar --exclude=node_modules -czf /tmp/db-migrate.tar.gz -C packages/db prisma package.json
          scp /tmp/db-migrate.tar.gz "root@${{ secrets.VPS_HOST }}:/root/db-migrate.tar.gz"

      # Runs `prisma migrate deploy` from a throwaway container attached to the same docker
      # network as the running api container, reading DATABASE_URL from that container's own env
      # (no DB credentials stored as a GitHub secret). The production api image doesn't ship the
      # prisma CLI (devDependency, not present in the runner image — see apps/api/Dockerfile), so
      # this uses a plain node image with just the schema/migrations mounted, mirroring the manual
      # process used to backfill migrations for the 2026-10-07 release.
      - name: Run database migrations
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          rm -rf /root/migrate-tmp
          mkdir -p /root/migrate-tmp
          tar -xzf /root/db-migrate.tar.gz -C /root/migrate-tmp
          rm -f /root/db-migrate.tar.gz

          API_CONTAINER=$(docker ps --format '{{.Names}}' | grep '^api-' | head -1)
          if [ -z "$API_CONTAINER" ]; then
            echo "No running api-* container found; cannot resolve DATABASE_URL/network." >&2
            exit 1
          fi
          DB_URL=$(docker exec "$API_CONTAINER" printenv DATABASE_URL)
          # The api container is attached to multiple docker networks, but only one of them
          # actually routes to the postgres container -- which one is NOT guaranteed to be first
          # in `docker inspect`'s network map (Go map iteration order is unspecified/randomized
          # per-process), so picking "the first network" is a real, intermittent failure mode
          # (observed directly: P1001 "Can't reach database server" on an otherwise-correct run).
          # Instead: connect the migration container to EVERY network the api container is on, so
          # whichever one actually reaches postgres always works, regardless of ordering.
          NETWORKS=$(docker inspect "$API_CONTAINER" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' | tr ' ' '\n' | grep -v '^$')
          if [ -z "$NETWORKS" ]; then
            echo "Could not resolve any docker network for $API_CONTAINER." >&2
            exit 1
          fi

          FIRST_NETWORK=$(echo "$NETWORKS" | head -1)
          docker create --name db-migrate-runner --network "$FIRST_NETWORK" \
            -v /root/migrate-tmp:/app -w /app \
            -e DATABASE_URL="$DB_URL" node:20-alpine \
            sh -c "npm install -g prisma@6.19.3 >/dev/null 2>&1 && prisma migrate deploy"
          echo "$NETWORKS" | tail -n +2 | while read -r net; do
            [ -n "$net" ] && docker network connect "$net" db-migrate-runner
          done
          set +e
          docker start -a db-migrate-runner
          MIGRATE_EXIT=$?
          set -e
          docker rm -f db-migrate-runner >/dev/null 2>&1 || true

          rm -rf /root/migrate-tmp
          exit $MIGRATE_EXIT
          REMOTE

  deploy:
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger guarded Coolify deploy (pulls the images just pushed above)
        # All 7 services now live in one consolidated Docker Compose resource — the original
        # 7 separate per-app Coolify "Application" resources were retired because each deploy
        # assigned containers a new random name, breaking inter-service DNS on every redeploy.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          STACK_UUID: ${{ vars.COOLIFY_STACK_UUID }}
        run: |
          ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" "coolify-guarded-deploy '$STACK_UUID'"
