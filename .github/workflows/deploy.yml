name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, inference-gateway, chat, dashboard, admin, marketing]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN was denied package-write (permission_denied: write_package) despite the
          # workflow's own packages:write permission — using a PAT with confirmed write:packages
          # scope instead.
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/realwise-${{ matrix.app }}:latest,ghcr.io/${{ env.IMAGE_OWNER }}/realwise-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://aichat.realwise.com.br/api
            NEXT_PUBLIC_CHAT_URL=https://aichat.realwise.com.br/client/conversation
            NEXT_PUBLIC_DASHBOARD_URL=https://aichat.realwise.com.br/app
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger guarded Coolify deploys (pulls the images just pushed above)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          API_UUID: ${{ vars.COOLIFY_APP_API_UUID }}
          WORKER_UUID: ${{ vars.COOLIFY_APP_WORKER_UUID }}
          GATEWAY_UUID: ${{ vars.COOLIFY_APP_INFERENCE_GATEWAY_UUID }}
          CHAT_UUID: ${{ vars.COOLIFY_APP_CHAT_UUID }}
          DASHBOARD_UUID: ${{ vars.COOLIFY_APP_DASHBOARD_UUID }}
          ADMIN_UUID: ${{ vars.COOLIFY_APP_ADMIN_UUID }}
          MARKETING_UUID: ${{ vars.COOLIFY_APP_MARKETING_UUID }}
        run: |
          for uuid in "$API_UUID" "$WORKER_UUID" "$GATEWAY_UUID" "$CHAT_UUID" "$DASHBOARD_UUID" "$ADMIN_UUID" "$MARKETING_UUID"; do
            ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" "coolify-guarded-deploy '$uuid'"
          done
